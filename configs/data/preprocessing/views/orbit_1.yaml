# @package views

name: orbit_1
elevation_deg: 20.0
yaw_degrees: [0.0]
focal_length_mm: 50.0
sensor_width_mm: 32.0
# Distance is derived from the normalized bounding sphere (radius 0.5) so the
# object fills this fraction of the camera half-FOV before per-view fitting.
fill_fraction: 0.85
